<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Dashboard - Sansun</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --main-bg: #f8fafc;
            --primary: #4a7c59;
            --primary-light: #eef4f0;
            --text-dark: #1e293b;
            --text-muted: #64748b;
            --card-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.04), 0 8px 10px -6px rgba(0, 0, 0, 0.04);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background-color: var(--main-bg); color: var(--text-dark); }

        .navbar { 
            background: #ffffff; 
            padding: 1.2rem 2.5rem; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.03); 
        }
        .logo { font-size: 1.4rem; font-weight: 700; color: var(--primary); display: flex; align-items: center; gap: 10px; text-decoration: none; }
        .user-nav-profile { display: flex; align-items: center; gap: 14px; }
        .avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--primary); color: white; display: flex; align-items: center; justify-content: center; font-weight: 700; }

        .container { max-width: 1200px; margin: 2.5rem auto; padding: 0 1.5rem; }
        
        .welcome-card { 
            background: linear-gradient(135deg, #4a7c59, #3b6346); 
            color: white; 
            border-radius: 20px; 
            padding: 2.5rem; 
            margin-bottom: 2rem; 
            box-shadow: 0 15px 30px rgba(74, 124, 89, 0.25); 
        }
        .welcome-card h2 { font-size: 1.8rem; font-weight: 700; }
        .welcome-card p { opacity: 0.9; margin-top: 6px; font-size: 0.95rem; }

        .dashboard-grid { display: grid; grid-template-columns: 1fr 2fr; gap: 2rem; }

        @media (max-width: 768px) {
            .dashboard-grid { grid-template-columns: 1fr; }
        }

        .card { 
            background: #ffffff; 
            border-radius: 18px; 
            padding: 1.8rem; 
            box-shadow: var(--card-shadow); 
            margin-bottom: 2rem; 
        }
        .card-header { 
            font-size: 1.1rem; 
            font-weight: 700; 
            color: var(--text-dark); 
            margin-bottom: 1.2rem; 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            border-bottom: 1px solid #f1f5f9; 
            padding-bottom: 0.8rem; 
        }

        .info-group { margin-bottom: 1.2rem; }
        .info-label { font-size: 0.8rem; color: var(--text-muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
        .info-val { font-weight: 600; font-size: 0.95rem; color: var(--text-dark); margin-top: 2px; }

        .form-group { margin-bottom: 1rem; }
        .form-group label { display: block; font-size: 0.85rem; font-weight: 600; color: var(--text-muted); margin-bottom: 6px; }
        .form-group input, .form-group select { 
            width: 100%; 
            padding: 10px 14px; 
            border: 1px solid #cbd5e1; 
            border-radius: 10px; 
            font-size: 0.9rem; 
            outline: none;
            transition: 0.2s ease;
        }
        .form-group input:focus, .form-group select:focus { border-color: var(--primary); }

        .btn-submit { 
            background: var(--primary); 
            color: white; 
            border: none; 
            padding: 10px 18px; 
            border-radius: 10px; 
            font-weight: 600; 
            cursor: pointer; 
            width: 100%;
            font-size: 0.9rem;
            transition: 0.2s ease;
        }
        .btn-submit:hover { background: #3b6346; }

        .event-card { 
            background: var(--primary-light); 
            border-left: 4px solid var(--primary); 
            border-radius: 12px; 
            padding: 1.2rem; 
            margin-bottom: 1rem; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            transition: transform 0.2s ease;
        }

        .badge { padding: 6px 14px; border-radius: 20px; font-size: 0.75rem; font-weight: 700; display: inline-block; }
        .badge.Approved { background: #dcfce7; color: #15803d; }
        .badge.Pending { background: #fff7ed; color: #c2410c; }
        .badge.Rejected { background: #fef2f2; color: #b91c1c; }

        .btn-logout { 
            background: #fee2e2; 
            color: #ef4444; 
            border: none; 
            padding: 8px 16px; 
            border-radius: 10px; 
            cursor: pointer; 
            font-weight: 600; 
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .btn-logout:hover { background: #fca5a5; }
    </style>
</head>
<body>

    <nav class="navbar">
        <a href="index.html" class="logo"><i class="fa-solid fa-heart-pulse"></i> සන්සුන් Dashboard</a>
        <div class="user-nav-profile">
            <div class="avatar" id="userAvatar">U</div>
            <button class="btn-logout" onclick="handleLogout()"><i class="fa-solid fa-right-from-bracket"></i> Logout</button>
        </div>
    </nav>

    <div class="container">
        <div class="welcome-card">
            <h2 id="welcomeText">ආයුබෝවන්! 👋</h2>
            <p>ඔබේ මානසික සුවතාවයේ ඉදිරි වැඩසටහන් සහ සටහන් මෙතැනින් බලන්න.</p>
        </div>

        <div class="dashboard-grid">
            <div>
                <div class="card">
                    <div class="card-header">
                        <span><i class="fa-regular fa-id-card"></i> Profile</span>
                    </div>
                    <div class="info-group">
                        <div class="info-label">නම</div>
                        <div class="info-val" id="profileName">User</div>
                    </div>
                    <div class="info-group">
                        <div class="info-label">ඊමේල්</div>
                        <div class="info-val" id="profileEmail">user@example.com</div>
                    </div>
                </div>

                <div class="card">
                    <div class="card-header">
                        <span><i class="fa-regular fa-calendar-plus"></i> Session එකක් Book කරන්න</span>
                    </div>
                    <form id="bookingForm" onsubmit="handleBooking(event)">
                        <div class="form-group">
                            <label>උපදේශන වර්ගය</label>
                            <select id="sessionType" required>
                                <option value="මානසික සහන සාකච්ඡාව">මානසික සහන සාකච්ඡාව</option>
                                <option value="Personal Counseling">Personal Counseling</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>දිනය</label>
                            <input type="date" id="sessionDate" required>
                        </div>
                        <div class="form-group">
                            <label>වේලාව</label>
                            <input type="time" id="sessionTime" required>
                        </div>
                        <button type="submit" class="btn-submit"><i class="fa-solid fa-paper-plane"></i> ඉල්ලීම යොමු කරන්න</button>
                    </form>
                </div>
            </div>

            <div>
                <div class="card">
                    <div class="card-header">
                        <span><i class="fa-regular fa-calendar-check"></i> ඔබගේ Session ඉල්ලීම් (My Sessions)</span>
                    </div>
                    <div id="eventsContainer">
                        <!-- Dynamic Sessions will load here -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentUser = null;

        document.addEventListener("DOMContentLoaded", () => {
            currentUser = JSON.parse(localStorage.getItem('sansun_user'));
            
            // Security Check
            if (!currentUser) {
                window.location.href = 'index.html';
                return;
            }

            const name = currentUser.name || currentUser.email.split('@')[0];
            document.getElementById('welcomeText').innerText = `ආයුබෝවන්, ${name}! 👋`;
            document.getElementById('profileName').innerText = name;
            document.getElementById('profileEmail').innerText = currentUser.email;
            document.getElementById('userAvatar').innerText = name.charAt(0).toUpperCase();

            loadUserSessions();
        });

        function handleLogout() {
            localStorage.removeItem('sansun_user');
            window.location.href = 'index.html'; // Fixed redirect bug
        }

        function handleBooking(event) {
            event.preventDefault();
            const type = document.getElementById('sessionType').value;
            const date = document.getElementById('sessionDate').value;
            const time = document.getElementById('sessionTime').value;

            const newSession = {
                id: 'SESS-' + Date.now(),
                userEmail: currentUser.email,
                userName: currentUser.name || currentUser.email.split('@')[0],
                type: type,
                date: date,
                time: time,
                status: 'Pending'
            };

            let sessions = JSON.parse(localStorage.getItem('sansun_sessions')) || [];
            sessions.push(newSession);
            localStorage.setItem('sansun_sessions', JSON.stringify(sessions));

            document.getElementById('bookingForm').reset();
            alert('ඔබගේ Session ඉල්ලීම සාර්ථකව යොමු කරන ලදී!');
            loadUserSessions();
        }

        function loadUserSessions() {
            const eventsContainer = document.getElementById('eventsContainer');
            eventsContainer.innerHTML = '';

            let sessions = JSON.parse(localStorage.getItem('sansun_sessions')) || [];
            let mySessions = sessions.filter(s => s.userEmail === currentUser.email);

            if (mySessions.length === 0) {
                eventsContainer.innerHTML = `<p style="color:var(--text-muted); font-size:0.9rem;">තවම Session ඉල්ලීම් සිදුකර නොමැත.</p>`;
                return;
            }

            mySessions.forEach(s => {
                const el = document.createElement('div');
                el.className = 'event-card';
                
                let badgeClass = s.status === 'Approved' ? 'Approved' : (s.status === 'Rejected' ? 'Rejected' : 'Pending');
                
                el.innerHTML = `
                    <div>
                        <strong style="color: var(--text-dark);">${s.type}</strong>
                        <p style="font-size:0.85rem; color: var(--text-muted); margin-top: 4px;">
                            <i class="fa-regular fa-clock"></i> ${s.date} | ${s.time}
                        </p>
                    </div>
                    <span class="badge ${badgeClass}">${s.status}</span>
                `;
                eventsContainer.appendChild(el);
            });
        }
    </script>
</body>
</html>
